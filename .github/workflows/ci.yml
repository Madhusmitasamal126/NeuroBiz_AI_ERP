
name: NeuroBiz AI ERP CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Validate and Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CI uses a dummy password because it only validates
    # Compose and builds images; it does not deploy the app.
    env:
      DB_PASSWORD: ci_dummy_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check required files
        run: |
          test -f docker-compose.yml
          test -f Dockerfile.backend
          test -f Dockerfile.fastapi
          test -f Dockerfile.frontend
          echo "All required Docker files exist."

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: CI completed
        run: echo "NeuroBiz AI ERP Docker build passed."
